
# Workflow автоматической публикации статического сайта на GitHub Pages
name: Deploy static site

# Запуск при каждом push в ветку main
on:
  push:
    branches: [main]

# Права доступа для GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Настройки параллельных запусков
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Шаг 1. Получить файлы репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2. Подготовить GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Шаг 3. Упаковать файлы сайта
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Шаг 4. Опубликовать сайт
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
